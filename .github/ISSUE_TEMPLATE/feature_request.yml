name: 改进建议
description: 提出功能、文档或项目导航改进。
title: "[建议] "
body:
  - type: input
    id: project
    attributes:
      label: 相关项目
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: 想解决的问题
      description: 描述使用场景，以及当前哪里不方便。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的变化
      description: 如涉及第三方资源，请说明来源和授权情况。
